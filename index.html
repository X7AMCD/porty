<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17191c">
<title>X7 Studios — Coming Soon</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{min-height:100svh;overflow:hidden;display:grid;place-items:center;position:relative;isolation:isolate;color:#f4f4f2;background:radial-gradient(ellipse at 18% 24%,rgba(190,197,207,.18),transparent 34%),radial-gradient(ellipse at 82% 76%,rgba(132,143,158,.17),transparent 38%),radial-gradient(ellipse at 52% 48%,rgba(255,255,255,.055),transparent 48%),#17191c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:absolute;z-index:-2;inset:-12%;background:radial-gradient(circle at 24% 35%,rgba(235,239,245,.20),rgba(235,239,245,.07) 12%,transparent 29%),radial-gradient(circle at 76% 30%,rgba(185,197,211,.16),transparent 27%),radial-gradient(circle at 62% 82%,rgba(224,228,235,.14),transparent 31%),radial-gradient(circle at 8% 88%,rgba(150,160,175,.13),transparent 24%);filter:blur(42px);transform:scale(1.08);animation:lightDrift 16s ease-in-out infinite alternate}
body:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(135deg,rgba(7,8,10,.28),transparent 48%,rgba(5,6,8,.34));pointer-events:none}
.content{width:min(90vw,680px);padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;transform:translateY(54px);animation:appear 1.1s ease both}
.logo-button{appearance:none;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;margin:0 0 40px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.22));transition:transform .25s ease,filter .25s ease,opacity .55s ease,scale .7s cubic-bezier(.16,1,.3,1)}
.logo-button.launching{transform:scale(2.8) rotate(-7deg);opacity:0;filter:drop-shadow(0 0 38px rgba(255,255,255,.8));pointer-events:none}
.logo-button:hover{transform:scale(1.035);filter:drop-shadow(0 10px 30px rgba(255,255,255,.12))}
.logo-button:focus-visible{outline:1px solid rgba(255,255,255,.75);outline-offset:12px;border-radius:8px}
.brand-logo{display:block;width:clamp(126px,19vw,184px);height:auto;object-fit:contain}
.eyebrow{margin:0 0 17px;color:rgba(244,244,242,.62);font-size:10px;font-weight:600;letter-spacing:.38em;text-transform:uppercase}
h1{margin:0;color:#f4f4f2;font-size:clamp(42px,9vw,76px);line-height:.98;font-weight:500;letter-spacing:-.065em}
.rule{width:42px;height:1px;margin:30px 0 23px;background:rgba(255,255,255,.55)}
.subtext{margin:0;color:#b9bbbe;font-size:clamp(13px,2vw,15px);line-height:1.7;letter-spacing:.035em}
.loading-dots{display:inline-flex;align-items:center;gap:8px;height:16px;margin-top:33px}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:rgba(245,245,242,.88);opacity:.28;animation:dotPulse 1.15s ease-in-out infinite}
.loading-dots span:nth-child(2){animation-delay:.18s}.loading-dots span:nth-child(3){animation-delay:.36s}
.footer{position:absolute;bottom:28px;left:20px;right:20px;color:rgba(235,237,240,.38);text-align:center;font-size:9px;letter-spacing:.25em;text-transform:uppercase}
@keyframes dotPulse{0%,80%,100%{opacity:.25;transform:translateY(0) scale(.82)}40%{opacity:1;transform:translateY(-4px) scale(1.12)}}
@keyframes lightDrift{from{transform:translate3d(-1.5%,-1%,0) scale(1.08)}to{transform:translate3d(1.5%,1%,0) scale(1.14)}}
@keyframes appear{from{opacity:0;transform:translateY(66px)}to{opacity:1;transform:translateY(54px)}}
.game{position:fixed;inset:0;z-index:5;display:none;background:rgba(14,16,19,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:clamp(14px,3vw,30px);align-items:center;justify-content:center}
.game.open{display:flex;animation:gameReveal .95s cubic-bezier(.16,1,.3,1) both}
.game-panel{width:min(100%,900px);display:flex;flex-direction:column;align-items:center;gap:12px}
.game-top{width:100%;display:flex;align-items:center;justify-content:space-between;color:#d7d9dc;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.game-top strong{font-weight:600;color:#fff}
.game-brand-logo{width:38px;height:32px;object-fit:contain;vertical-align:middle;margin-right:9px;filter:drop-shadow(0 2px 8px rgba(255,255,255,.18))}
.game-actions{display:flex;gap:16px;align-items:center}
.game-actions button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#eee;border-radius:99px;padding:8px 13px;font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
#gameCanvas{display:block;width:100%;height:min(68svh,590px);border:1px solid rgba(255,255,255,.12);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));box-shadow:0 25px 90px rgba(0,0,0,.28);touch-action:none}
.game-complete{animation:playfieldRetreat 1.25s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes playfieldRetreat{to{opacity:0;filter:blur(16px);transform:scale(.94)}}
.game-hint{margin:0;color:rgba(235,237,240,.52);font-size:11px;letter-spacing:.04em;text-align:center}
.touch-controls{display:none;gap:18px;align-items:center;justify-content:center;width:100%;touch-action:none}
.touch-controls button{width:min(34vw,150px);height:48px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(255,255,255,.08);color:#f4f4f2;font-size:20px;touch-action:none;user-select:none}
#endScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 46%,rgba(150,160,176,.18),transparent 48%),rgba(10,12,15,.97);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:opacity 1.7s ease,backdrop-filter 1.7s ease,-webkit-backdrop-filter 1.7s ease;z-index:2}
#endScreen.visible{opacity:1;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#endScreen strong{opacity:0;transform:translateY(24px) scale(.94);filter:blur(10px);transition:opacity 1.1s ease .45s,transform 1.4s cubic-bezier(.16,1,.3,1) .45s,filter 1.1s ease .45s}
#endScreen.visible strong{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
#endScreen span{opacity:0;transform:translateY(12px);transition:opacity 1s ease 1.05s,transform 1s ease 1.05s}
#endScreen.visible span{opacity:1;transform:translateY(0)}
#endScreen strong{font-size:clamp(54px,12vw,112px);font-weight:500;letter-spacing:.22em;text-indent:.22em}
#endScreen span{margin-top:16px;color:rgba(245,245,245,.66);font-size:13px;letter-spacing:.24em}
#loseScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 46%,rgba(180,80,90,.16),transparent 48%),rgba(10,12,15,.97);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:opacity 1s ease,backdrop-filter 1s ease;z-index:3}
#loseScreen.visible{opacity:1;pointer-events:auto;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#loseScreen strong{font-size:clamp(48px,10vw,92px);font-weight:500;letter-spacing:.16em;text-indent:.16em;opacity:0;transform:translateY(18px);transition:opacity .8s ease .2s,transform .9s cubic-bezier(.16,1,.3,1) .2s}
#loseScreen.visible strong{opacity:1;transform:translateY(0)}
#loseScreen span{color:rgba(245,245,245,.62);font-size:11px;letter-spacing:.2em}
#retryGame{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#f4f4f2;border-radius:99px;padding:12px 22px;font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-top:8px}
#retryGame:hover{background:rgba(255,255,255,.16)}
@media(hover:none),(pointer:coarse){.touch-controls{display:flex}}
@keyframes gameReveal{0%{opacity:0;clip-path:circle(0 at 50% 42%);filter:blur(18px);transform:scale(.96)}65%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:1;clip-path:circle(150% at 50% 42%);filter:blur(0);transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.logo-button.launching{transition:none}.game.open{animation:none;clip-path:none}}
@media(max-width:520px){.content{transform:translateY(36px)}.logo-button{margin-bottom:34px}.footer{bottom:20px;font-size:8px}#gameCanvas{height:62svh}.game-top{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
(() => {
 const launch = document.getElementById('logoLaunch');
 const game = document.getElementById('game');
 const close = document.getElementById('closeGame');
 const canvas = document.getElementById('gameCanvas');
 const ctx = canvas.getContext('2d');
 const logoBallImage = launch.querySelector('.brand-logo');
 const scoreEl = document.getElementById('score');
 const livesEl = document.getElementById('lives');
 const hint = document.getElementById('gameHint');
 const endScreen = document.getElementById('endScreen');
 const loseScreen = document.getElementById('loseScreen');
 const retryButton = document.getElementById('retryGame');
 const comingDateEl = document.getElementById('comingDate');
 const touchLeft = document.getElementById('touchLeft');
 const touchRight = document.getElementById('touchRight');
 // Change this date whenever you want the launch date displayed.
 const COMING_DATE = '01.12.2026';
 comingDateEl.textContent = COMING_DATE;
 let confetti=[], ending=false, endStarted=0, cheatBuffer='';

 let w=800,h=520,dpr=1, raf=0, running=false, launched=false, score=0, lives=3;
 let paddle={x:350,y:480,w:105,h:9};
 let ball={x:400,y:455,r:17,vx:3.2,vy:-4.2,angle:0};
 let bricks=[], keys={left:false,right:false}, pointerX=null, last=0;

 const makeBricks=()=>{
   bricks=[]; confetti=[]; ending=false; canvas.classList.remove('game-complete'); endScreen.classList.remove('visible'); loseScreen.classList.remove('visible');
   const cols=12, rows=7, gap=9, side=27, top=55;
   const square=Math.min(29,(w-side*2-gap*(cols-1))/cols);
   const gridWidth=cols*square+(cols-1)*gap;
   const left=(w-gridWidth)/2;
   for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
     bricks.push({x:left+c*(square+gap),y:top+r*(square+gap),w:square,h:square,alive:true,row:r});
 };
 const updateLabels=()=>{scoreEl.textContent='SCORE  '+score;livesEl.textContent='LIVES  '+lives};
 const resize=()=>{
   const rect=canvas.getBoundingClientRect();
   dpr=Math.min(window.devicePixelRatio||1,2);
   w=Math.max(320,rect.width);h=Math.max(300,rect.height);
   canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);
   paddle.w=Math.max(82,Math.min(112,w*.13));paddle.h=8;paddle.y=h-34;
   if(!launched){paddle.x=(w-paddle.w)/2;ball.x=w/2;ball.y=paddle.y-25;}
   makeBricks();draw();
 };
 const resetBall=()=>{
   launched=false;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-25;ball.angle=0;
   ball.vx=(Math.random()>.5?1:-1)*3.2;ball.vy=-4.2;
   hint.textContent='Click or press Space to launch. Move with mouse, touch, or ← → keys.';
 };
 const start=()=>{
   launch.classList.remove('launching');
   void launch.offsetWidth;
   launch.classList.add('launching');
   window.setTimeout(()=>launch.classList.remove('launching'),850);
   game.classList.add('open');document.body.style.overflow='hidden';
   score=0;lives=3;launched=false;running=true;ending=false;endScreen.classList.remove('visible');updateLabels();
   requestAnimationFrame(()=>{resize();resetBall();cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(loop)});
 };
 const stop=()=>{running=false;cancelAnimationFrame(raf);game.classList.remove('open');document.body.style.overflow=''};
 const launchBall=()=>{if(!launched&&running){launched=true;hint.textContent='Break every square. No power-ups.'}};
 const draw=()=>{
   ctx.clearRect(0,0,w,h);
   // subtle court glow
   const glow=ctx.createRadialGradient(w/2,h*.48,10,w/2,h*.48,w*.65);
   glow.addColorStop(0,'rgba(210,218,230,.055)');glow.addColorStop(1,'rgba(210,218,230,0)');
   ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
   bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=['#d9dce1','#b9bec7','#969eaa','#c8cdd5','#aab1bc'][b.row];ctx.globalAlpha=.88;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(b.x,b.y,b.w,2);ctx.globalAlpha=1});
   ctx.fillStyle='#f0f1f3';ctx.shadowColor='rgba(255,255,255,.35)';ctx.shadowBlur=14;ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.shadowBlur=0;
   // The X7 logo itself is the Breakout ball — it travels and spins around the court.
   if(logoBallImage && logoBallImage.complete && logoBallImage.naturalWidth){
     const logoW=ball.r*2.15, logoH=logoW*(logoBallImage.naturalHeight/logoBallImage.naturalWidth);
     ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.angle);
     ctx.shadowColor='rgba(255,255,255,.55)';ctx.shadowBlur=16;
     ctx.drawImage(logoBallImage,-logoW/2,-logoH/2,logoW,logoH);
     ctx.restore();
   }
   if(!launched&&!ending){ctx.fillStyle='rgba(255,255,255,.45)';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('CLICK TO LAUNCH THE X7',w/2,h-12)}
   confetti.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.life/55);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.45);ctx.restore()});
 };
 const finish=(won)=>{
   launched=false;running=false;
   if(won){winSequence();return;}
   canvas.classList.add('game-complete');
   loseScreen.classList.add('visible');
   hint.textContent='';
 };
 const burst=(x,y)=>{const colors=['#ff5d73','#ffd166','#65d6ce','#8e9bff','#f4f4f2','#c084fc'];for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*4;confetti.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:42+Math.random()*18,size:3+Math.random()*4,rot:Math.random()*6,color:colors[Math.floor(Math.random()*colors.length)]})}};
 // Every ball hit triggers a row-based chain reaction. The third row
 // breaks up to four blocks; each of the bottom two rows breaks up to two.
 // Other rows break up to eight. Chains stay within the row that was hit.
 const breakWithChain=(first)=>{
   const row=first.row;
   // Random chain size for the row hit. Row 1 means the top row.
   const rowRanges=[[1,2],[2,4],[3,4],[6,7],[5,7],[5,7],[6,7]];
   const [minForRow,maxForRow]=rowRanges[row] || [1,8];
   const chainLimit=Math.min(8,minForRow+Math.floor(Math.random()*(maxForRow-minForRow+1)));
   const broken=[first];first.alive=false;
   let current=first;
   burst(first.x+first.w/2,first.y+first.h/2);
   while(broken.length<chainLimit){
     let next=null, bestDistance=Infinity;
     for(const candidate of bricks){
       if(!candidate.alive || candidate.row!==row)continue;
       const dx=(candidate.x+candidate.w/2)-(current.x+current.w/2);
       const dy=(candidate.y+candidate.h/2)-(current.y+current.h/2);
       const distance=Math.hypot(dx,dy);
       if(distance<bestDistance){next=candidate;bestDistance=distance;}
     }
     if(!next)break;
     next.alive=false;broken.push(next);current=next;
     burst(next.x+next.w/2,next.y+next.h/2);
   }
   score+=broken.length*10;
   updateLabels();
   return broken.length;
 };
 const winSequence=()=>{if(ending)return;ending=true;launched=false;running=false;canvas.classList.add('game-complete');endScreen.classList.add('visible');hint.textContent='';};
 const skipToEnd=()=>{if(!game.classList.contains('open'))return;bricks.forEach(b=>b.alive=false);score+=bricks.length*10;updateLabels();winSequence();};
 const restart=()=>{score=0;lives=3;updateLabels();makeBricks();loseScreen.classList.remove('visible');endScreen.classList.remove('visible');canvas.classList.remove('game-complete');running=true;resetBall();last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)};
 const loop=(time)=>{
   if(!running)return;
   const dt=Math.min((time-last||16.67)/16.67,2);last=time;
   if(pointerX!==null)paddle.x=pointerX-paddle.w/2;
   if(keys.left)paddle.x-=6*dt;if(keys.right)paddle.x+=6*dt;
   paddle.x=Math.max(0,Math.min(w-paddle.w,paddle.x));
   if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-25;}
   else{
     ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.angle+=((ball.vx*.018)+(ball.vy*.006))*dt;
     if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
     if(ball.x>w-ball.r){ball.x=w-ball.r;ball.vx=-Math.abs(ball.vx)}
     if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
     if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
       const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
       ball.vx=hit*5.2;ball.vy=-Math.max(3.6,Math.sqrt(34-ball.vx*ball.vx));
       ball.y=paddle.y-ball.r;
     }
     for(const b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){breakWithChain(b);burst(ball.x,ball.y);ball.vy*=-1;break}}
     if(ball.y>h+ball.r){lives--;updateLabels();if(lives<=0){finish(false)}else resetBall()}
     if(bricks.every(b=>!b.alive)){score+=100;updateLabels();winSequence()}
   }
   confetti=confetti.filter(p=>p.life>0);confetti.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.rot+=.12*dt;p.life-=dt});
   draw();
   if(running)raf=requestAnimationFrame(loop);
 };
 launch.addEventListener('click',start);
 close.addEventListener('click',stop);
 retryButton.addEventListener('click',()=>{loseScreen.classList.remove('visible');restart()});
 canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointerX=e.clientX-r.left;});
 canvas.addEventListener('pointerleave',()=>{pointerX=null});
 const hold=(el,dir)=>{const down=e=>{e.preventDefault();keys[dir]=true};const up=()=>{keys[dir]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up));};
 hold(touchLeft,'left');hold(touchRight,'right');
 canvas.addEventListener('pointerdown',()=>{if(!running)restart();else launchBall()});
 window.addEventListener('keydown',e=>{
   if(!game.classList.contains('open'))return;
   if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
   if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;
   if(e.key.length===1){cheatBuffer=(cheatBuffer+e.key.toUpperCase()).slice(-5);if(cheatBuffer==='X7END')skipToEnd()}
   if(e.key===' '){if(!running)restart();else launchBall()}
   if(e.key==='Escape')stop();
 });
 window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
 window.addEventListener('resize',()=>{if(game.classList.contains('open'))resize()});
})();
</script>
</body>
